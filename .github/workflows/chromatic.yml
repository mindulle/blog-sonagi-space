name: "Chromatic (Visual Regression)"

on:
  pull_request:
    branches: [ "main" ]

jobs:
  chromatic:
    name: Run Chromatic for Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic requires full git history

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Configure GitHub Packages auth for pnpm
        # ci.yml과 동일한 이유 — 프로젝트 .npmrc의 env 치환은 pnpm 보안 패치로
        # 무시되므로 신뢰되는 global 설정에 직접 기록합니다.
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "${{ secrets.PACKAGES_READ_TOKEN }}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright Tests (Generates Chromatic Archives)
        run: pnpm run test:e2e

      - name: Upload to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          playwright: true
