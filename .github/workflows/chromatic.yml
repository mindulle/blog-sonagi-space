name: "Chromatic (Visual Regression)"

on:
  pull_request:
    branches: [ "main" ]

jobs:
  chromatic:
    name: Run Chromatic for Playwright
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Chromatic requires full git history

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright Tests (Generates Chromatic Archives)
        run: pnpm run test:e2e

      - name: Upload to Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: pnpm run chromatic --project-token=$CHROMATIC_PROJECT_TOKEN
