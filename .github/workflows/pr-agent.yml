name: PR-Agent

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created, edited]

jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    name: Run PR Agent
    continue-on-error: true
    steps:
      - name: PR Agent action step
        id: pragent
        uses: Codium-ai/pr-agent@main
        continue-on-error: true
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY || secrets.AI_REVIEW_API_KEYS }}
          GEMINI_API_KEY: ${{ secrets.AI_REVIEW_API_KEYS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
