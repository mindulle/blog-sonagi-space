[pr_reviewer]
extra_instructions = """
[Sonagi Architecture Convention Check]
이 레포지토리는 블로그(blog-sonagi-space) 프로젝트입니다.
PR 리뷰 시 아래 규칙을 엄격히 검사하고 위반 시 지적(Request Changes)하세요.

1. 콘텐츠 SSOT (CRITICAL): 블로그의 모든 본문 텍스트나 게시물 원본은 마크다운(llm-wiki) 또는 CMS를 통해 동기화되어야 합니다. 소스 코드 내부에 긴 텍스트 콘텐츠를 직접 하드코딩했는지 검사하세요.
2. 이미지 및 에셋 참조: 프로젝트 저장소 내부에 이미지 파일(png, jpg 등)을 직접 업로드하지 않았는지 확인하세요. 모든 정적 에셋은 MinIO CDN(cdn.sonagi.space) URL을 참조해야 합니다.
3. 마케팅 웹 디자인 룰: 마케팅/콘텐츠 웹이므로 Framer와 협업하는 구조를 가집니다. 불필요하게 무거운 클라이언트 상태 관리(Global State)나 비즈니스 로직이 프론트엔드에 하드코딩되었는지 확인하세요.
"""
